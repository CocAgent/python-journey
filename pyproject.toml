[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.11",
]

[tool.python-journey]
python-requires = ">=3.12"

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = [
    "tests",
    "projects/vuacoc-bot-journey/tests",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
