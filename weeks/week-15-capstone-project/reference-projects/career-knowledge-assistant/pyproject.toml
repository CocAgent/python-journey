[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "career-knowledge-assistant"
version = "1.0.0"
description = "Python Journey reference capstone: local career knowledge and skill tracker"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]
api = ["fastapi>=0.115", "uvicorn>=0.30"]
dashboard = ["streamlit>=1.40"]
api-test = ["fastapi>=0.115", "httpx>=0.27", "pytest>=8"]

[tool.setuptools]
packages = ["career_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
